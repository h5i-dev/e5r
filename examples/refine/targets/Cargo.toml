# The candidate refinement targets (docs/isa/refine-targets.md), compiled into
# the profile to count their functions per level. Not part of the workspace.
[package]
name = "refine-targets"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["staticlib"]
path = "src/lib.rs"

[dependencies]
cobs = { version = "=0.5.1", default-features = false }
memchr = { version = "=2.8.3", default-features = false }
httparse = { version = "=1.10.1", default-features = false }
bytecount = { version = "=0.6.9", default-features = false }
crc32fast = { version = "=1.5.5", default-features = false }
base64 = { version = "=0.23.1", default-features = false }

[profile.release]
opt-level = 3
panic = "abort"
codegen-units = 1
lto = false
debug = false

[workspace]
