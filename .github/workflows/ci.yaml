name: ci

# `main`, `next` and pull requests, and nothing else.
#
# A branch name in this list is a name that will be wrong later: it was
# `full-rewrite-to-rs`, which is one branch of one period of this repository's
# life, and every other branch went unchecked while that one burned a runner on
# every push. Work in progress is checked when it is proposed, which is what a
# pull request is; a push to a branch nobody has proposed is not yet a claim
# that anything works. `next` is the exception: it is the integration branch
# that main is merged from, and what lands there is a claim.
on:
  push:
    branches: [main, next]
  # Any base branch, so a feature branch proposed against anything is checked.
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

# One in-flight run per ref. Pushing a fix ten seconds after a typo should not
# leave the first run holding a runner; `main` is exempt so a merge is never
# cancelled by the merge behind it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Keep package mirror/network stalls bounded, separately from analysis time.
# apt options below retain retries and fail with the actual download error.
jobs:
  # The core: the nocompiler tool's tests with every oracle installed (llvm-mc for the
  # decoder, qemu-riscv64 and the Sail model for the semantics), then the Lean library,
  # the example proofs and their audit, then the example build compared with
  # the committed binaries.
  core:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Oracles (llvm-mc, clang, ld.lld, qemu-riscv64)
        run: |
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update -q
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y --no-install-recommends clang lld llvm qemu-user
      - name: Lean (elan; the version comes from lean/lean-toolchain)
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/v4.1.2/elan-init.sh -o elan-init.sh
          sh elan-init.sh -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      # The Sail RISC-V model's C emulator, pinned by release and checksum:
      # the oracle for crates/nocompiler/tests/sail.rs.
      - name: Sail RISC-V emulator (2026-11-16-a2ad4b5)
        run: |
          curl -sSfL -o "$RUNNER_TEMP/sail.tar.gz" \
            https://github.com/riscv/sail-riscv/releases/download/2026-11-16-a2ad4b5/sail-riscv-Linux-x86_64.tar.gz
          echo "c84d705711319112888f91315f3e4d93843b5b9c0de7f0dceac5f438d013c1dc  $RUNNER_TEMP/sail.tar.gz" | sha256sum -c
          tar -xzf "$RUNNER_TEMP/sail.tar.gz" -C "$RUNNER_TEMP"
          echo "SAIL_RISCV_SIM=$RUNNER_TEMP/sail-riscv-Linux-x86_64/bin/sail_riscv_sim" >> "$GITHUB_ENV"
      - name: Lean library, example proofs and the axiom audit
        working-directory: lean
        run: lake build
      - name: The proofs' images are the committed binaries
        working-directory: lean
        run: lake exe nocompiler-audit
      - run: cargo test -p nocompiler --no-fail-fast -- --nocapture
      - run: cargo build -p nocompiler
      - name: Negative controls, every mutated binary breaks its proof
        env:
          NOCOMPILER: ${{ github.workspace }}/target/debug/nocompiler
        run: ./scripts/check-proof-controls.sh
      - name: Audit controls, every broken relinked binary fails the module audit
        run: ./scripts/check-audit-controls.sh
      # docs/isa/vocab.md: the specifications themselves. Every computable one
      # against an independent reference, and every spec mutation but COBS's
      # (a few minutes; the full set is the manual spec-mutations workflow).
      - name: Executable specifications against independent references
        run: python3 -I scripts/check-spec-references.py
      - name: Spec mutations, every altered spec breaks its proofs (without COBS)
        run: python3 -I scripts/check-spec-mutations.py --skip demo-cobs
      - name: Rebuild the examples (a different clang may differ; reported, not gated)
        run: NOCOMPILER=target/debug/nocompiler ./examples/build.sh || echo "::warning::examples/build.sh, the build differs from examples/elf/"

  # Runners are disposable, so these build the dev profile on purpose. The
  # release-only rule in CONTRIBUTING.md is about the maintainer's machine.
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings

  # G2, G3, G4, G6, G7, G9: the whole suite, with the corpus built so the
  # oracle-backed gates actually run. Without fixtures they skip silently.
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      # Whole-corpus decompilation takes tens of minutes without optimization.
      # Keep test-profile debug assertions and overflow checks enabled.
      CARGO_PROFILE_TEST_OPT_LEVEL: 2
    steps:
      - uses: actions/checkout@v4
      # The AArch64 std, for the Rust fixture: `build-fixtures.sh` builds it
      # for a fixed target so the counts the tests hold do not follow the host.
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu
      - uses: Swatinem/rust-cache@v2
      # Every gate that has no tool skips silently, which is the worst
      # possible outcome: a green run that measured nothing. These are what
      # the oracle-backed gates need, named so a missing one is visible.
      #   clang, llvm, binutils  the fixture corpus and objdump parity
      #   llvm-objdump           the ARM32 and x86-64 parity oracles
      #   gcc-aarch64-linux-gnu  the `.a64` corpus. This runner is x86-64, so
      #                          without it plain `gcc` writes an x86-64 binary
      #                          into a name claiming AArch64, and the tests
      #                          that read one measure the wrong file
      #   qemu-user-static       both halves of the lifter's hardware oracle,
      #                          and the recorded output of every executed
      #                          AArch64 fixture
      #   golang-go              the Go fixture, which found five decoder bugs
      - name: Install the oracles
        run: |
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y clang llvm binutils qemu-user-static golang-go \
            gcc-aarch64-linux-gnu g++-aarch64-linux-gnu
      - name: Build the fixture corpus
        run: ./devinfra/scripts/build-fixtures.sh
      - name: Say which oracles are present
        run: |
          for t in clang llvm-objdump objdump readelf c++filt qemu-x86_64 go rustc; do
            printf '%-16s %s\n' "$t" "$(command -v $t || echo MISSING)"
          done
      # `--no-fail-fast`: without it cargo stops at the first failing test
      # binary, so a runner that differs from the maintainer's machine in
      # several ways reports them one push at a time.
      - run: cargo test --workspace --no-fail-fast -- --nocapture

  # G5: the same bytes must produce the same output at any thread count.
  determinism:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      # The AArch64 std, for the Rust fixture: `build-fixtures.sh` builds it
      # for a fixed target so the counts the tests hold do not follow the host.
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu
      - uses: Swatinem/rust-cache@v2
      # The cross gcc because this runner is x86-64 and a `.a64` fixture
      # has to be AArch64; qemu because several of them are executed.
      - run: |
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y clang \
            gcc-aarch64-linux-gnu g++-aarch64-linux-gnu qemu-user-static
      - run: ./devinfra/scripts/build-fixtures.sh
      - run: cargo build --release
      - run: ./devinfra/scripts/check-determinism.sh

  # G8: what the analysis FOUND, against the floors in devinfra/scripts/bench-budget.json.
  #
  # Not a benchmark, and deliberately not run as one. Recall against the symbol
  # table and the count of entries no symbol names are the same bytes in, same
  # numbers out, on any machine at any thread count, so they gate. Wall time
  # and peak memory are facts about a machine, and a shared runner with a noisy
  # neighbour is not the machine the ceilings were recorded on -- so timing is
  # not measured here, not gated here, and not published from here. It is
  # measured by hand on a known machine and written down in devinfra/docs/benchmarks.md.
  #
  # One run per binary for the same reason: the fastest of three exists to beat
  # down timing noise, and there is no timing to beat down.
  recall:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      # The AArch64 std, for the Rust fixture: `build-fixtures.sh` builds it
      # for a fixed target so the counts the tests hold do not follow the host.
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu
      - uses: Swatinem/rust-cache@v2
      # The cross gcc because this runner is x86-64 and a `.a64` fixture
      # has to be AArch64; qemu because several of them are executed.
      - run: |
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y clang binutils \
            gcc-aarch64-linux-gnu g++-aarch64-linux-gnu qemu-user-static
      - run: ./devinfra/scripts/build-fixtures.sh
      # Release, like determinism above: the recall numbers have to come from
      # the code path a user runs.
      - run: cargo build --release
      - run: RUNS=1 SKIP=rizin OUT="$GITHUB_WORKSPACE/target/recall.json" ./devinfra/scripts/compare-tools.sh
      - run: ./devinfra/scripts/check-bench-budget.py "$GITHUB_WORKSPACE/target/recall.json" --portable-only --no-timing

  # `install.sh` is what people pipe into a shell, and nothing else in this
  # workflow would notice it rotting: it is not built, not linked and not
  # imported. Two checks, both cheap.
  #
  # `sh -n` is the syntax gate. `shellcheck` is the rest of it -- an unquoted
  # expansion in an installer run as root is not a style note -- and it is
  # pinned to POSIX `sh` because the shebang is `sh`, not bash.
  installer:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: sh -n devinfra/install.sh
      - run: sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update -q && sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y shellcheck
      - run: shellcheck --shell=sh devinfra/install.sh
      # The one thing syntax cannot see: that the script still knows where the
      # release puts things. `build-release.sh` names the archive and the
      # directory inside it, and the installer reaches into that directory by
      # name -- so a change to either that forgot the other is a download that
      # unpacks into a path nobody looks at.
      - name: The installer agrees with the release layout
        run: ./devinfra/scripts/check-installer.sh

  # Experiment F (experiment/docs/firmware.md): rebuild the firmware and the
  # clamp fixture with the pinned rustc, recheck every verification job from
  # source with the pinned Lean, run the negative controls, and replay QEMU
  # traces (instruction-level in user mode, the whole firmware on sifive_e)
  # in the model. nocompiler itself is the dev profile here, like the rest
  # of this workflow; the firmware is built --release because its bytes are
  # pinned.
  firmware-verification:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Pinned Rust for the firmware and fixtures
        run: rustup toolchain install 1.98.1 --profile minimal --target riscv32imac-unknown-none-elf --component llvm-tools
      - name: Lean (elan; the version comes from experiment/verification/rv32/lean-toolchain)
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/v4.1.2/elan-init.sh -o elan-init.sh
          sh elan-init.sh -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: RISC-V binutils 2.42 and QEMU 8.2.2 (Ubuntu 24.04)
        run: sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update -q && sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y --no-install-recommends binutils-riscv64-linux-gnu qemu-user qemu-system-misc
      - run: cargo build -p nocompiler-verify
      - name: Every firmware proof, control and differential test
        env:
          NOCOMPILER_VERIFY: ${{ github.workspace }}/target/debug/nocompiler-exp
        run: ./experiment/scripts/check-firmware-verification.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: firmware-verification-results
          path: experiment/verification/rv32/build/results/

  # Experiment P (experiment/docs/ptx.md), the quick set: regenerate every PTX
  # kernel module and refuse a stale one, build the Lean project, audit the
  # axioms, and check every benchmark's verdict with `nocompiler ptx check`. It has to
  # finish in minutes, so it stops there (NOCOMPILER_PTX_QUICK).
  #
  # What it leaves out is what makes a full recheck take ~90 minutes: the 59
  # mutation controls and the supplied-proof controls, each of which starts Lean
  # many times. Those are mutation testing, not a per-push check; they run by
  # hand (`experiment/scripts/recheck-ptx.sh`) or from the manual ptx-full workflow. No GPU
  # or CUDA here: the ptxas and GPU steps skip and say so.
  ptx-verification:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Lean (elan; the version comes from experiment/verification/ptx/lean-toolchain)
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/v4.1.2/elan-init.sh -o elan-init.sh
          sh elan-init.sh -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      # The Lean proof build is the one thing `rust-cache` does not cover.
      # `experiment/verification/ptx` has no fetched dependencies (core Lean only), so
      # `.lake/build` is a function of the pinned toolchain and the Lean sources
      # alone: key the cache on both and `lake build` is a near-no-op on a hit.
      # The key changes whenever any proof, kernel module or the toolchain does,
      # so a stale build is never restored, which is why the script's
      # from-scratch `rm -rf` is skipped here (NOCOMPILER_PTX_KEEP_BUILD=1).
      #
      # Restore and save are separate steps, and save runs `always()`. A single
      # `actions/cache` step saves only when the job succeeds, so a job that is
      # cancelled at its time limit never saves and every retry starts cold.
      - name: Restore the Lean build
        id: lake
        uses: actions/cache/restore@v4
        with:
          path: experiment/verification/ptx/.lake/build
          key: ptx-lake-${{ runner.os }}-${{ hashFiles('experiment/verification/ptx/lean-toolchain', 'experiment/verification/ptx/lakefile.lean', 'experiment/verification/ptx/lake-manifest.json', 'experiment/verification/ptx/**/*.lean') }}
      - run: cargo build -p nocompiler-verify
      - name: Lean proofs, axiom audit and benchmark verdicts
        env:
          NOCOMPILER_VERIFY: ${{ github.workspace }}/target/debug/nocompiler-exp
          NOCOMPILER_PTX_KEEP_BUILD: "1"
          NOCOMPILER_PTX_QUICK: "1"
        run: ./experiment/scripts/recheck-ptx.sh
      - name: Save the Lean build
        if: always() && steps.lake.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: experiment/verification/ptx/.lake/build
          key: ${{ steps.lake.outputs.cache-primary-key }}
