name: bench

# G8. Split in two, because the two halves of the benchmark budget are not
# checkable in the same place.
#
# What the analysis FOUND is deterministic: recall against the symbol table and
# the count of entries no symbol names are the same bytes in, same numbers out,
# on any machine and at any thread count. That half runs on every push, needs
# no tool but the repository's own build, and takes seconds.
#
# What the analysis COST is not. The ceilings in scripts/bench-budget.json were
# recorded on the maintainer's aarch64 machine; a shared x86-64 runner with a
# noisy neighbour would fail them for reasons that have nothing to do with a
# regression. So every job here passes --no-timing, and wall time and peak
# memory stay a number a person reruns and records, not a gate.
#
# Ghidra is deliberately not installed: it is a 400 MB download plus a JDK, and
# a per-push job that spends four minutes downloading a JVM to analyze a 71 KB
# fixture is a job people turn off. scripts/compare-tools.sh picks it up from
# GHIDRA_INSTALL_DIR if a future runner has one cached.

on:
  push:
    branches: [main, full-rewrite-to-rs]
  pull_request:
  # The comparison against another tool is worth a weekly run and not a
  # per-push one: it installs rizin, and its numbers move when rizin moves,
  # which is not a fact about this repository's last commit.
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  # Every push: r12e alone, against the portable half of the budget.
  budget:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y clang binutils
      - name: Build the fixture corpus
        run: ./scripts/build-fixtures.sh
      # Release, like the determinism job: a dev-profile binary measures the
      # profile rather than the analysis, and the recall numbers have to come
      # from the same code path a user runs.
      - run: cargo build --release
      - name: Measure
        run: SKIP=rizin OUT=target/bench-tools.json ./scripts/compare-tools.sh
      - name: Check the budget
        run: ./scripts/check-bench-budget.py target/bench-tools.json --portable-only --no-timing
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bench-budget
          path: target/bench-tools.json

  # Weekly, and on request: the same measurement with rizin beside it, so the
  # comparison in docs/benchmarks.md does not quietly go stale. The budget
  # check is the same one; rizin's numbers are published, not gated, because
  # they move when rizin releases and that is not our regression to fail on.
  compare:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install the other tool
        # Ubuntu's rizin is older than the one the recorded numbers came from,
        # so the run prints the version it measured and the table it produces
        # is comparable only against another run of the same version.
        run: |
          sudo apt-get update
          sudo apt-get install -y clang binutils rizin
      - run: ./scripts/build-fixtures.sh
      - run: cargo build --release
      - name: Measure both tools on the fixtures
        # Fixtures only: this runner's libc is not the machine's libc that the
        # published system-library rows were measured on, and a table mixing
        # the two would compare different binaries under the same name.
        run: |
          OUT=target/bench-tools.json ./scripts/compare-tools.sh \
            fixtures/build/hello.a64.O2 \
            fixtures/build/hello.a64.O2.stripped \
            fixtures/build/hello.static.a64 \
            fixtures/build/hello.static.a64.stripped \
            fixtures/build/hello.go \
            fixtures/build/hello.go.stripped \
            fixtures/build/cpp-hierarchy.a64.O2.rtti \
            fixtures/build/cpp-hierarchy.a64.O2.rtti.stripped \
            fixtures/build/panicky \
            fixtures/build/driver.x64.O2
      - name: Check the budget
        run: ./scripts/check-bench-budget.py target/bench-tools.json --portable-only --no-timing
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bench-compare
          path: target/bench-tools.json
