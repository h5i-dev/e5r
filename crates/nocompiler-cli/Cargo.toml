[package]
name = "nocompiler-cli"
description = "nocompiler: check RISC-V binaries against a formal-verification-friendly profile and export them to Lean 4; and a binary analysis toolkit (load, recover functions, disassemble, decompile, diff)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
homepage.workspace = true
documentation.workspace = true
# Inherited, so the path is the workspace README rather than a second copy.
readme.workspace = true
keywords.workspace = true
categories.workspace = true
# No `include` list on purpose: everything under the crate directory is the
# package, so a file added later cannot be left out of it silently. Nothing in
# the build reads a file outside the package either (no build script, no
# include_str! of a fixture), which is what makes the published copy build
# where fixtures/ and scripts/ do not exist.

[[bin]]
name = "nocompiler"
path = "src/main.rs"

[dependencies]
nocompiler = { workspace = true }
nocompiler-core = { workspace = true }
nocompiler-format = { workspace = true }
nocompiler-arch = { workspace = true }
nocompiler-analysis = { workspace = true }
nocompiler-asm = { workspace = true }
nocompiler-db = { workspace = true }
nocompiler-diff = { workspace = true }
nocompiler-types = { workspace = true }
nocompiler-ir = { workspace = true }
nocompiler-decomp = { workspace = true }
nocompiler-api = { workspace = true }
clap = { workspace = true }
memmap2 = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

tiny_http = "0.12"

[dev-dependencies]
serde_json = { workspace = true }
