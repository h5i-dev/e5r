[package]
name = "r12e-decomp"
description = "r12e — expression rebuilding, structuring and C emission."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
r12e-core = { workspace = true }
r12e-arch = { workspace = true }
r12e-ir = { workspace = true }
serde = { workspace = true }

[dev-dependencies]
r12e-analysis = { workspace = true }
r12e-format = { workspace = true }
# Path only, with no version. A dev-dependency that carries a version is
# resolved against the registry when the crate is packaged, and these two
# point back at this crate and at one that depends on it, which is a cycle
# nothing can publish. Stripped from the published manifest without one.
r12e-decomp = { path = "." }
r12e-api = { path = "../r12e-api" }
