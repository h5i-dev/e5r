[package]
name = "r12e-cli"
description = "r12e — the command line. Load a binary, recover functions, disassemble, decompile, diff."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
homepage.workspace = true
documentation.workspace = true
# Inherited, so the path is the workspace README rather than a second copy.
readme.workspace = true
keywords.workspace = true
categories.workspace = true
# No `include` list on purpose: everything under the crate directory is the
# package, so a file added later cannot be left out of it silently. Nothing in
# the build reads a file outside the package either (no build script, no
# include_str! of a fixture), which is what makes the published copy build
# where fixtures/ and scripts/ do not exist.

[[bin]]
name = "r12e"
path = "src/main.rs"

[dependencies]
r12e-core = { workspace = true }
r12e-format = { workspace = true }
r12e-arch = { workspace = true }
r12e-analysis = { workspace = true }
r12e-asm = { workspace = true }
r12e-db = { workspace = true }
r12e-diff = { workspace = true }
r12e-types = { workspace = true }
r12e-ir = { workspace = true }
r12e-decomp = { workspace = true }
r12e-api = { workspace = true }
clap = { workspace = true }
memmap2 = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
