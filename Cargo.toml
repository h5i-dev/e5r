# e5r: a formal-verification-friendly RISC-V profile, with Lean 4 proofs.
#
# crates/              the core: the e5r tool (crate `e5r`, binary `e5r`); lean/ has the proofs
# devinfra/crates/     the binary analysis toolkit (`e5rx`), development infrastructure
# experiment/crates/   the PTX and RV32 firmware verifiers (`e5r-exp`), experiments
#
# The core depends on nothing in devinfra/ or experiment/. Toolkit crate
# boundaries are documented in devinfra/docs/ROADMAP-toolkit.md.
[workspace]
members = ["crates/*", "devinfra/crates/*", "experiment/crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
repository = "https://github.com/h5i-dev/e5r"
authors = ["e5r contributors"]
# Publishing metadata. Here rather than in each crate so a crate that becomes
# publishable only has to opt in.
homepage = "https://github.com/h5i-dev/e5r"
documentation = "https://docs.rs/e5r-cli"
readme = "README.md"
keywords = ["risc-v", "formal-verification", "lean4", "binary", "elf"]
categories = ["command-line-utilities", "development-tools::debugging"]

[workspace.dependencies]
e5r-core = { path = "devinfra/crates/e5r-core", version = "0.1.0" }
e5r-format = { path = "devinfra/crates/e5r-format", version = "0.1.0" }
e5r-arch = { path = "devinfra/crates/e5r-arch", version = "0.1.0" }
e5r-asm = { path = "devinfra/crates/e5r-asm", version = "0.1.0" }
e5r-sla = { path = "devinfra/crates/e5r-sla", version = "0.1.0" }
e5r-sleigh = { path = "devinfra/crates/e5r-sleigh", version = "0.1.0" }
e5r-analysis = { path = "devinfra/crates/e5r-analysis", version = "0.1.0" }
e5r-db = { path = "devinfra/crates/e5r-db", version = "0.1.0" }
e5r-types = { path = "devinfra/crates/e5r-types", version = "0.1.0" }
e5r-diff = { path = "devinfra/crates/e5r-diff", version = "0.1.0" }
e5r-ir = { path = "devinfra/crates/e5r-ir", version = "0.1.0" }
e5r-decomp = { path = "devinfra/crates/e5r-decomp", version = "0.1.0" }
e5r-api = { path = "devinfra/crates/e5r-api", version = "0.1.0" }
e5r-ptx = { path = "experiment/crates/e5r-ptx", version = "0.1.0" }

# Kept deliberately short. Loaders and decoders are written here rather than
# pulled in, because provenance tagging and hostile-input behaviour are the
# product, not an implementation detail we can delegate.
memmap2 = "0.9"
rayon = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.5", features = ["derive", "wrap_help"] }

# A dev-profile build lands in target/debug, which this checkout forbids
# (see CONTRIBUTING.md, "Building"). Release is the only profile used here.
[profile.release]
opt-level = 3
# Off on purpose: this machine has 7.5 GB of RAM and debug info in a workspace
# this size makes linking the peak-memory step. Profile with a temporary
# override when a flamegraph is actually needed.
debug = false
lto = "thin"
codegen-units = 16
panic = "unwind"
