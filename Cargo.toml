# nocompiler: a formal-verification-friendly RISC-V profile, with Lean 4 proofs.
#
# crates/nocompiler    the core: profile checker, metadata, Lean exporter (library `nocompiler`); lean/ has the proofs
# crates/nocompiler-*  the binary analysis toolkit (loaders, decoders, IR, decompiler, differ, ...)
# experiment/crates/   the PTX and RV32 firmware verifiers (`nocompiler-exp`), experiments
#
# The core library depends on no other crate. Toolkit crate boundaries are
# documented in docs/toolkit/ROADMAP-toolkit.md.
[workspace]
members = ["crates/*", "experiment/crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
repository = "https://github.com/h5i-dev/NoCompiler"
authors = ["nocompiler contributors"]
# Publishing metadata. Here rather than in each crate so a crate that becomes
# publishable only has to opt in.
homepage = "https://github.com/h5i-dev/NoCompiler"
documentation = "https://docs.rs/nocompiler-cli"
readme = "README.md"
keywords = ["risc-v", "formal-verification", "lean4", "binary", "elf"]
categories = ["command-line-utilities", "development-tools::debugging"]

[workspace.dependencies]
nocompiler = { path = "crates/nocompiler", version = "0.1.0" }
nocompiler-core = { path = "crates/nocompiler-core", version = "0.1.0" }
nocompiler-format = { path = "crates/nocompiler-format", version = "0.1.0" }
nocompiler-arch = { path = "crates/nocompiler-arch", version = "0.1.0" }
nocompiler-asm = { path = "crates/nocompiler-asm", version = "0.1.0" }
nocompiler-sla = { path = "crates/nocompiler-sla", version = "0.1.0" }
nocompiler-sleigh = { path = "crates/nocompiler-sleigh", version = "0.1.0" }
nocompiler-analysis = { path = "crates/nocompiler-analysis", version = "0.1.0" }
nocompiler-db = { path = "crates/nocompiler-db", version = "0.1.0" }
nocompiler-types = { path = "crates/nocompiler-types", version = "0.1.0" }
nocompiler-diff = { path = "crates/nocompiler-diff", version = "0.1.0" }
nocompiler-ir = { path = "crates/nocompiler-ir", version = "0.1.0" }
nocompiler-decomp = { path = "crates/nocompiler-decomp", version = "0.1.0" }
nocompiler-api = { path = "crates/nocompiler-api", version = "0.1.0" }
nocompiler-ptx = { path = "experiment/crates/nocompiler-ptx", version = "0.1.0" }

# Kept deliberately short. Loaders and decoders are written here rather than
# pulled in, because provenance tagging and hostile-input behaviour are the
# product, not an implementation detail we can delegate.
memmap2 = "0.9"
rayon = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.5", features = ["derive", "wrap_help"] }

# A dev-profile build lands in target/debug, which this checkout forbids
# (see CONTRIBUTING.md, "Building"). Release is the only profile used here.
[profile.release]
opt-level = 3
# Off on purpose: this machine has 7.5 GB of RAM and debug info in a workspace
# this size makes linking the peak-memory step. Profile with a temporary
# override when a flamegraph is actually needed.
debug = false
lto = "thin"
codegen-units = 16
panic = "unwind"
