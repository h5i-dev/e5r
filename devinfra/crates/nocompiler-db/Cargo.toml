[package]
name = "nocompiler-db"
description = "nocompiler — content anchors and the git-mergeable annotation log."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
nocompiler-core = { workspace = true }
nocompiler-arch = { workspace = true }
nocompiler-types = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

# The signature gate measures against a real statically linked binary and
# builds its library out of the distribution's own static archives, so it needs
# a loader and an analysis. Neither of those depends on this crate, so the edge
# only exists for the tests.
[dev-dependencies]
nocompiler-format = { workspace = true }
nocompiler-analysis = { workspace = true }
