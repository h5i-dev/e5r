[package]
name = "nocompiler-decomp"
description = "nocompiler — expression rebuilding, structuring and C emission."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
nocompiler-core = { workspace = true }
nocompiler-arch = { workspace = true }
nocompiler-ir = { workspace = true }
serde = { workspace = true }

[dev-dependencies]
nocompiler-analysis = { workspace = true }
nocompiler-format = { workspace = true }
# Path only, with no version. A dev-dependency that carries a version is
# resolved against the registry when the crate is packaged, and these two
# point back at this crate and at one that depends on it, which is a cycle
# nothing can publish. Stripped from the published manifest without one.
nocompiler-decomp = { path = "." }
nocompiler-api = { path = "../nocompiler-api" }
