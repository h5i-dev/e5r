name = "nocompiler"
version = "0.1.0"
defaultTargets = ["NoCompiler", "Examples", "Demo", "nocompiler-audit"]

# No dependencies on purpose: the trusted base of an nocompiler proof is the Lean
# kernel plus the definitions docs/isa/trust.md lists.
[[lean_lib]]
name = "NoCompiler"

[[lean_lib]]
name = "Examples"

# The A-vs-B demo (demo/README.md).
[[lean_lib]]
name = "Demo"

[[lean_exe]]
name = "nocompiler-audit"
root = "Audit"

# Runs compressed code in the extension's semantics, for demo/test/rvc_exec.py.
[[lean_exe]]
name = "rvc-run"
root = "RvcRun"
