name = "e5r"
version = "0.1.0"
defaultTargets = ["E5R", "Examples", "Demo", "e5r-audit"]

# No dependencies on purpose: the trusted base of an e5r proof is the Lean
# kernel plus the definitions docs/isa/trust.md lists.
[[lean_lib]]
name = "E5R"

[[lean_lib]]
name = "Examples"

# The A-vs-B demo (demo/README.md).
[[lean_lib]]
name = "Demo"

[[lean_exe]]
name = "e5r-audit"
root = "Audit"

# Runs compressed code in the extension's semantics, for demo/test/rvc_exec.py.
[[lean_exe]]
name = "rvc-run"
root = "RvcRun"
